# Grafana settings that environment variables can't carry.
#
# Mounted over the image's /etc/grafana/grafana.ini (which ships with every
# line commented out), so Grafana's built-in defaults apply to everything not
# set here. The rest of the configuration lives in compose.yaml as GF_*
# environment variables; this file only holds feature toggles, because Grafana
# applies GF_* overrides only to keys that already exist in a config file, and
# toggles have no entry there.
#
# Grafana reads this file at startup: after editing it, run
#   docker compose restart grafana
# (the deploy timer only recreates containers when compose.yaml changes).

[feature_toggles]
# Drilldown > Metrics: a queryless browser for Prometheus metrics. This stack
# only has a Postgres datasource, so it has nothing to show.
exploreMetrics = false
# Administration > General > Migrate to Grafana Cloud.
onPremToCloudMigrations = false
# Administration > Plugins and data > Correlations: links between data sources
# in Explore, which needs more than the one datasource provisioned here.
correlations = false
